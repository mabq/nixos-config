# For options info see `man foot.ini`

[main]
# Must be an absolute path or start with `~/`. Variables are not accepted, so
# we must hard-code the current theme path here.
include=~/.config/mynix/theme/foot.ini
term=xterm-256color
font=monospace:size=9
pad=14x14
# Disable multithread rendering
workers=0

[scrollback]
lines=10000
multiplier=0.7

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
